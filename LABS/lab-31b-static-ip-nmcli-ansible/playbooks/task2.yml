---
# Lab 31b Task 2 — update then remove the profile
#
# Run:
#   ansible-playbook /root/rhcsa_journal/lab-31b/playbooks/task2.yml
#
# SYSTEM-STATE (safe): updates the DNS server on lab-static, then removes the
# profile with state:absent (the declarative nmcli con delete). Comment out the
# removal task if you want to keep the profile for Lab 31c.

- name: "Lab 31b Task 2 — update then remove the profile"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  tasks:
    - name: "Update the DNS server on lab-static"
      community.general.nmcli:
        conn_name: lab-static
        type: dummy
        method4: manual
        ip4: 10.99.99.2/24
        dns4:
          - 10.99.99.54
        state: present
      register: upd

    - name: "Show the change status"
      ansible.builtin.debug:
        msg: "changed: {{ upd.changed }}"

    - name: "Remove the profile (cleanup demo)"
      community.general.nmcli:
        conn_name: lab-static
        type: dummy
        state: absent
      register: rm
