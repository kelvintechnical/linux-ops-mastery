---
# Lab 17b Task 2 — normalize permissions on found configs
#
# Run (twice, to prove idempotence):
#   ansible-playbook /root/rhcsa_journal/lab-17b/playbooks/task2.yml
#   ansible-playbook /root/rhcsa_journal/lab-17b/playbooks/task2.yml
#
# Expected: changed=1 on the first run, changed=0 on the second. The play
# discovers .conf files, then loops a state-aware file task to set each to
# 0640 — looping structured results instead of parsing shell output.

- name: "Lab 17b Task 2 — normalize permissions on found configs"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: /tmp/lab-17/etc

  tasks:
    - name: "Find the .conf files"
      ansible.builtin.find:
        paths: "{{ root }}"
        patterns: "*.conf"
        file_type: file
        recurse: true
      register: find_result

    - name: "Set each config to 0640"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0640'
      loop: "{{ find_result.files }}"
      loop_control:
        label: "{{ item.path }}"
