---
# Lab 07b Task 2 — find files by age
#
# Run:
#   ansible-playbook /root/rhcsa_journal/lab-07b/playbooks/task2.yml
#
# Expected: the debug task lists the aged app.log (mtime pinned to 2026-01-01
# in Task 1, older than 1 day). ansible.builtin.find is read-only, so the
# PLAY RECAP shows changed=0.

- name: "Lab 07b Task 2 — find files by age"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    log_dir: /tmp/lab-07/logs

  tasks:
    - name: "Find .log files older than 1 day (by mtime)"
      ansible.builtin.find:
        paths: "{{ log_dir }}"
        patterns: "*.log"
        age: "1d"
        age_stamp: mtime
        recurse: true
      register: old_logs

    - name: "Show how many matched and their paths"
      ansible.builtin.debug:
        msg:
          - "matched: {{ old_logs.matched }}"
          - "files: {{ old_logs.files | map(attribute='path') | list }}"
