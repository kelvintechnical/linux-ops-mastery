---
- name: "Lab 36b Task 1 — declare a static profile"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: "Ensure lab-cli matches the desired static config"
      community.general.nmcli:
        conn_name: lab-cli
        ifname: dummy0
        type: dummy
        method4: manual
        ip4: 10.66.66.2/24
        gw4: 10.66.66.1
        dns4:
          - 10.66.66.53
          - 10.66.66.54
        state: present
      register: nm

    - name: "Show whether anything changed"
      ansible.builtin.debug:
        msg: "changed: {{ nm.changed }}"
