---
# Lab 06b Task 1 — build the content directory
#
# Run (twice, to prove idempotence):
#   ansible-playbook /root/rhcsa_journal/lab-06b/playbooks/task1.yml
#   ansible-playbook /root/rhcsa_journal/lab-06b/playbooks/task1.yml
#
# Expected: changed=2 on the first run, changed=0 on the second. file and
# copy are state-aware, so the directory and index page converge.

- name: "Lab 06b Task 1 — build the content directory"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    webroot: /tmp/lab-06/webroot

  tasks:
    - name: "Ensure the webroot exists"
      ansible.builtin.file:
        path: "{{ webroot }}"
        state: directory
        mode: '0755'

    - name: "Write the index page"
      ansible.builtin.copy:
        dest: "{{ webroot }}/index.html"
        content: "<h1>lab 06</h1>\n"
        mode: '0644'
