---
# Lab 15b Task 1 — install mlocate and build index
- name: Lab 15b Task 1 — mlocate + updatedb
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Ensure mlocate package is installed
      ansible.builtin.dnf:
        name: mlocate
        state: present

    - name: Run updatedb to build or refresh index
      ansible.builtin.command: updatedb
      register: updatedb_out
      changed_when: true

    - name: Confirm database file exists
      ansible.builtin.stat:
        path: /var/lib/mlocate/mlocate.db
      register: mlocate_db

    - name: Report database size
      ansible.builtin.debug:
        msg: "mlocate.db present={{ mlocate_db.stat.exists }}, size={{ mlocate_db.stat.size | default(0) }} bytes"

    - name: Show locate statistics (read-only)
      ansible.builtin.command: locate -S
      register: locate_stats
      changed_when: false

    - name: Print first lines of locate -S
      ansible.builtin.debug:
        msg: "{{ locate_stats.stdout_lines[:8] }}"
